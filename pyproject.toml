[tool.poetry]
name = "recipe-recommender"
version = "0.2.0"
description = "An intelligent recipe recommendation system with advanced search capabilities"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "streamlit", from = "." }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.3.1"
scikit-learn = "^1.7.1"
streamlit = "^1.47.1"
duckdb = "^1.3.2"
plotly = "^5.18.0"
typing-extensions = "^4.8.0"
ruff = "^0.13.2"
bandit = "^1.8.6"
mypy = "^1.18.2"
no-implicit-optional = "^1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.13.2"
flake8 = "^6.1.0"
mypy = "^1.7.0"
pandas-stubs = "^2.3.2.250926"
types-tqdm = "^4.67.0.20250809"
pytest-mock = "^3.15.1"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=./ --cov-report=term-missing"
