[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Ignore missing stubs for these packages
[mypy-duckdb.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

# Be more permissive with Streamlit files
[mypy-streamlit.streamlit_app]
# Ignore all attribute errors in Streamlit app
ignore_errors = True

# Be more permissive with data processor
[mypy-data.data_processor]
# Ignore all errors in data processor
ignore_errors = True
